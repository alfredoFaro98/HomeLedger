services:
  app:
    image: homeledger-app:latest
    build: .
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://homeledger:homeledger@db:5432/homeledger?sslmode=disable"
      HOMELEDGER_USERNAME: "${HOMELEDGER_USERNAME:-}"
      HOMELEDGER_PASSWORD: "${HOMELEDGER_PASSWORD:-}"
    ports:
      - "18090:8080"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: homeledger
      POSTGRES_USER: homeledger
      POSTGRES_PASSWORD: homeledger
    volumes:
      - homeledger_postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

volumes:
  homeledger_postgres:
